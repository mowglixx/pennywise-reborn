#
# This compose file is only really used as a
# standalone API instance, please run the full
# container stack in the root repository for
# the full service including the frontend
#
name: pennywise-api

services:
  db:
    container_name: pennywise-api-db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pennywise
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Commented out becuase the service communicates over the docker internal network
    # ports: 
    #   - 5432:5432
  api:
    container_name: pennywise-api-server
    build: ./server
    environment:
      - API_EXTERNAL_URL=https://money.example.com/api
      - API_SERVER_PORT=9000
      - FRONTEND_URLS=["https://money.example.com"]
      - DB_URL="postgresql://postgres:postgrespassword@pennywise-api-db:5432/pennywise"
    depends_on:
      - db
    volumes:
      - pennywise-api-data:/app

  client:
    container_name: pennywise-api-client
    build: 
      context: ./client
    depends_on:
      - api
    volumes:
      - pennywise-client-data:/app

    

volumes:
  pennywise-client-data:
  pennywise-api-data:
  postgres_data:
